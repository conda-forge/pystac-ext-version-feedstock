schema_version: 1

context:
  version: "1.2.1"

package:
  name: pystac-ext-version
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-version/pystac_ext_version-${{ version }}.tar.gz
  sha256: 7ae63cab8440ee7e2da19e2024ecd55a7affb022ba9384eefe5bd98ce85f21da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.version
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Version extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-version/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
